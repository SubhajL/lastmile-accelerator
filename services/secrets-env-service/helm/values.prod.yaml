image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-secrets-env-service
  tag: replace-with-ci-tag
service:
  port: 7104
env:
  ENV: prod
  SERVICE_PORT: '7104'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  VAULT_ADDR: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: secrets-env-service-secrets
  remotePath: secret/data/lma/secrets-env-service/prod
  keys:
  - VAULT_ROLE_ID
  - VAULT_SECRET_ID
