image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-motivation-engine-service
  tag: replace-with-ci-tag
service:
  port: 7601
env:
  ENV: prod
  SERVICE_PORT: '7601'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  NUDGE_HEURISTICS_JSON: ''
  WS_CLUSTER_ID: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: motivation-engine-service-secrets
  remotePath: secret/data/lma/motivation-engine-service/prod
  keys: []
