image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-fix-engine-service
  tag: replace-with-ci-tag
service:
  port: 7151
env:
  ENV: prod
  SERVICE_PORT: '7151'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  PATCH_MAX_FILES: ''
  PATCH_MAX_LOC: ''
  PATCH_TTL_DAYS: ''
  DIFF_ENGINE: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: fix-engine-service-secrets
  remotePath: secret/data/lma/fix-engine-service/prod
  keys: []
