image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-secrets-env-service
  tag: dev
service:
  port: 7104
env:
  ENV: dev
  SERVICE_PORT: '7104'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-dev.svc.cluster.local:4317
  VAULT_ADDR: ''
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
hpa:
  enabled: false
externalSecrets:
  enabled: true
  storeRefName: vault-dev
  targetName: secrets-env-service-secrets
  remotePath: secret/data/lma/secrets-env-service/dev
  keys:
  - VAULT_ROLE_ID
  - VAULT_SECRET_ID
