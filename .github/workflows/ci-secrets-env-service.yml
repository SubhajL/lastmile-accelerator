name: ci-secrets-env-service
on:
  push: { branches: [ main ], paths: [ 'services/secrets-env-service/**' ] }
jobs:
  call:
    uses: ./.github/workflows/_service-ci.yml
    with:
      lang: go
      context: services/secrets-env-service
      dockerfile: services/secrets-env-service/Dockerfile
      image_suffix: secrets-env-service
