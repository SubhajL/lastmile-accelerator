image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-spec-memory-service
  tag: replace-with-ci-tag
service:
  port: 7101
env:
  ENV: staging
  SERVICE_PORT: '7101'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-staging.svc.cluster.local:4317
  EMBEDDING_PROVIDER: ''
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
externalSecrets:
  enabled: true
  storeRefName: vault-staging
  targetName: spec-memory-service-secrets
  remotePath: secret/data/lma/spec-memory-service/staging
  keys:
  - DATABASE_URL
  - EMBEDDING_API_KEY
