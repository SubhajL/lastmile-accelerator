name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    # Auto-review on PR open/update, or manual trigger via @claude comment
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this PR thoroughly. Check for:
            1. Code correctness and potential bugs
            2. Type safety (no unnecessary `any`, proper error handling)
            3. Security issues (OWASP top 10, secret leaks, injection)
            4. Test coverage (are new features tested?)
            5. Adherence to conventional commits
            6. Architecture and design patterns

            Be concise but thorough. Flag blockers vs nice-to-haves.

            IMPORTANT: You MUST post your review as a PR comment using `gh pr comment`.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues inline.
            Only post GitHub comments - do not submit review text as messages.
