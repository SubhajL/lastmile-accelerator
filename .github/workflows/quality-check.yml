name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Quality Check
        run: bun run quality:check
