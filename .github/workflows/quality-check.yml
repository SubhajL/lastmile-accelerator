name: CI / quality-check

on:
  pull_request:
    branches:
      - '**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.34'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality:check
        run: bun run quality:check
