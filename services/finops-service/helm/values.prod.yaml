image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-finops-service
  tag: replace-with-ci-tag
service:
  port: 7401
env:
  ENV: prod
  SERVICE_PORT: '7401'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  CLOUD_COST_EXPORT_S3: ''
  FORECAST_HORIZON_DAYS: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: finops-service-secrets
  remotePath: secret/data/lma/finops-service/prod
  keys:
  - STRIPE_API_KEY
