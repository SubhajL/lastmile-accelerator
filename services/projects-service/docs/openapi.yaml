openapi: 3.1.0
info:
  title: Projects Service API
  version: 1.0.0
  description: REST API for managing projects, members, tenants, and environments.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Project:
      type: object
      required: [id, tenant_id, name]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
    Member:
      type: object
      required: [id, tenant_id, email, role]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, admin, developer, viewer]
    Environment:
      type: object
      required: [id, project_id, name]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
paths:
  /v1/projects:
    get:
      summary: List projects
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope projects:read.
    post:
      summary: Create project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope projects:write.
  /v1/projects/{projectId}:
    get:
      summary: Get project by id
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope projects:read.
    put:
      summary: Update project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope projects:write.
    delete:
      summary: Delete project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        '204': { description: No Content }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope projects:write.
  /v1/tenants/{tenantId}:
    get:
      summary: Get tenant
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { id: { type: string }, name: { type: string } }, required: [id] } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope tenants:read.
  /v1/tenants/{tenantId}/members:
    get:
      summary: List tenant members
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope tenants:read.
    post:
      summary: Add tenant member
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, developer, viewer] }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope members:write.
  /v1/members/{memberId}:
    put:
      summary: Update member role
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, developer, viewer] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope members:write.
    delete:
      summary: Remove member
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: No Content }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope members:write.
  /v1/projects/{projectId}/environments:
    get:
      summary: List environments
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Environment' } } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope environments:read.
    post:
      summary: Create environment
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                config: { type: object, additionalProperties: true }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope environments:write.
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              examples:
                ok:
                  value:
                    status: ok
                    service: projects-service
                    timestamp: '2025-01-01T00:00:00.000Z'
  /metrics:
    get:
      summary: Prometheus metrics (text)
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
              examples:
                snippet:
                  value: |
                    # HELP request_total Total number of HTTP requests
                    # TYPE request_total counter
                    request_total{service_name="projects-service"} 10
  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  details: { type: object }
              examples:
                ready:
                  value:
                    ok: true
                    details:
                      db: { healthy: true }
                      nats: { healthy: true }
        '503':
          description: Not Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  details: { type: object }
              examples:
                notready:
                  value:
                    ok: false
                    details:
                      db: { healthy: false, error: 'db down' }
                      nats: { healthy: true }
  /v1/projects/{projectId}/environments/{envId}:
    put:
      summary: Update environment
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: envId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config: { type: object, additionalProperties: true }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope environments:write.
    delete:
      summary: Delete environment
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: envId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: No Content }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope environments:write.
  /v1/projects/{projectId}/ingestion-modes:
    post:
      summary: Set ingestion modes
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modes, defaultMode]
              properties:
                modes: { type: array, items: { type: string } }
                defaultMode: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } }, required: [ok] } } } }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      description: Requires scope environments:write.
