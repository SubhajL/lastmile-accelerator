openapi: 3.0.3
info:
  title: ingestion API
  version: 1.0.0
paths:
  /v1/projects/{projectId}/ingest/zip:
    post:
      summary: Ingest a ZIP upload and create a snapshot
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZipIngestReq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZipIngestRes'
components:
  schemas:
    ZipIngestReq:
      type: object
      required: [filename, sizeBytes, sha256]
      properties:
        filename: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the uploaded archive
    ZipIngestRes:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { type: string }

