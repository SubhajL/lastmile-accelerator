title = "LMA gitleaks"
[allowlist]
paths = [
  '''^packages/contracts/.*\.(json|yaml)$''',
  '''^.*\.md$''',
  '''^services/.*/src/__tests__/.*''',
  '''^services/.*/internal/.*_test\.(go)$''',
  '''^dev/.*''',
  '''^lma-devstack-compose-.*''',
]
regexes = [
  '''(?i)https?://(localhost|127\.0\.0\.1)(:[0-9]{2,5})?(/[^\s]*)?''',
  '''(?i)nts?://localhost(:[0-9]{2,5})?''',
  '''(?i)r?edis://localhost(:[0-9]{2,5})?''',
  '''(?i)pg(sql)?://[^\s]+''',
  '''(?i)eyJ[a-z0-9_\-\.]+\.[a-z0-9_\-\.]+\.[a-z0-9_\-\.]+''',
  '''(?i)sk_(live|test)_[a-z0-9]{10,}''',
  '''(?i)ghp_[a-z0-9]{10,}''',
  '''(?i)xox[bap]-[a-z0-9\-]{6,}''',
  '''(?i)AKIA[0-9A-Z]{16}''',
]
