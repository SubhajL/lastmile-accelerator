components:
  schemas:
    ApiError:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CveResponse:
      properties:
        cveId:
          type: string
        cvssScore:
          format: float
          nullable: true
          type: number
        description:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        publishedAt:
          format: date-time
          nullable: true
          type: string
        severity:
          type: string
        source:
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - cveId
      - severity
      - updatedAt
      type: object
    CveSummary:
      properties:
        cveId:
          type: string
        cvssScore:
          format: float
          nullable: true
          type: number
        severity:
          type: string
      required:
      - cveId
      - severity
      type: object
    DependencyResponse:
      properties:
        ecosystem:
          type: string
        id:
          format: uuid
          type: string
        isDirect:
          type: boolean
        name:
          type: string
        parentId:
          format: uuid
          nullable: true
          type: string
        version:
          type: string
      required:
      - id
      - name
      - version
      - ecosystem
      - isDirect
      type: object
    DependencyVulnResponse:
      properties:
        affectedVersionRange:
          nullable: true
          type: string
        cve:
          $ref: '#/components/schemas/CveSummary'
        fixedVersion:
          nullable: true
          type: string
        status:
          type: string
      required:
      - cve
      - status
      type: object
    LinkResponse:
      properties:
        affectedVersionRange:
          nullable: true
          type: string
        cveId:
          format: uuid
          type: string
        dependencyId:
          format: uuid
          type: string
        fixedVersion:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        status:
          type: string
      required:
      - id
      - dependencyId
      - cveId
      - status
      type: object
    LinkVulnRequest:
      properties:
        affectedVersionRange:
          nullable: true
          type: string
        cveId:
          type: string
        fixedVersion:
          nullable: true
          type: string
        status:
          type: string
      required:
      - cveId
      - status
      type: object
    Sbom:
      properties:
        file_hash:
          type: string
        format:
          type: string
        generated_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        snapshot_id:
          format: uuid
          type: string
        storage_key:
          type: string
      required:
      - id
      - snapshot_id
      - format
      - storage_key
      - file_hash
      - generated_at
      type: object
    SbomCreateRequest:
      properties:
        fileHash:
          type: string
        format:
          type: string
        storageKey:
          type: string
      required:
      - format
      - storageKey
      - fileHash
      type: object
    UpsertCveRequest:
      properties:
        cveId:
          type: string
        cvssScore:
          format: float
          nullable: true
          type: number
        description:
          nullable: true
          type: string
        publishedAt:
          nullable: true
          type: string
        severity:
          type: string
        source:
          nullable: true
          type: string
      required:
      - cveId
      - severity
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
info:
  description: ''
  license:
    name: ''
  title: dep-governance-service API
  version: 1.0.0
openapi: 3.0.3
paths:
  /v1/cves:
    post:
      operationId: upsert_cve_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/super.types.UpsertCveRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/super.types.CveResponse'
          description: Upserted CVE
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/crate.openapi.ApiError'
          description: Bad request
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - crate::handlers::api::cves
  /v1/dependencies/{dependency_id}/vulns:
    get:
      operationId: get_dependency_vulns_handler
      parameters:
      - description: Dependency ID
        in: path
        name: dependency_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DependencyVulnResponse'
                type: array
          description: Dependency vulnerabilities
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - crate::handlers::api::vulns
  /v1/dependencies/{dependency_id}/vulns/link:
    post:
      operationId: link_vuln_handler
      parameters:
      - description: Dependency ID
        in: path
        name: dependency_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/super.types.LinkVulnRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/super.types.LinkResponse'
          description: Linked
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/crate.openapi.ApiError'
          description: Bad request
        '401':
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/crate.openapi.ApiError'
          description: Conflict
      security:
      - bearerAuth: []
      tags:
      - crate::handlers::api::cves
  /v1/snapshots/{snapshot_id}/dependencies:
    get:
      operationId: list_dependencies_handler
      parameters:
      - description: Snapshot ID
        in: path
        name: snapshot_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Filter direct dependencies only
        in: query
        name: direct
        required: false
        schema:
          nullable: true
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DependencyResponse'
                type: array
          description: Dependencies
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - crate::handlers::api::deps
  /v1/snapshots/{snapshot_id}/sbom:
    get:
      operationId: get_latest_sbom_handler
      parameters:
      - description: Snapshot ID
        in: path
        name: snapshot_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/crate.models.Sbom'
          description: Latest SBOM
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - crate::handlers::api::sbom
    post:
      operationId: create_sbom_handler
      parameters:
      - description: Snapshot ID
        in: path
        name: snapshot_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SbomCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/crate.models.Sbom'
          description: SBOM created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/crate.openapi.ApiError'
          description: Bad request
        '401':
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/crate.openapi.ApiError'
          description: Conflict
      security:
      - bearerAuth: []
      tags:
      - crate::handlers::api::sbom
security:
- bearerAuth: []
