image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-zip-ingest-service
  tag: replace-with-ci-tag
service:
  port: 7052
env:
  ENV: prod
  SERVICE_PORT: '7052'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  MAX_UPLOAD_MB: ''
  CLAMAV_URL: ''
  ZIP_UPLOAD_BACKEND: s3
  ZIP_UPLOAD_PREFIX: zip-uploads/
  SNAPSHOT_S3_REGION: us-east-1
  SNAPSHOT_S3_FORCE_PATH_STYLE: 'true'
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: zip-ingest-service-secrets
  remotePath: secret/data/lma/zip-ingest-service/prod
  keys:
  - SNAPSHOT_BUCKET
  - SNAPSHOT_S3_ENDPOINT
  - SNAPSHOT_S3_ACCESS_KEY
  - SNAPSHOT_S3_SECRET_KEY
