openapi: 3.0.3
info:
  title: ingestion API
  version: 1.0.0
paths:
  /v1/projects/{projectId}/ingest/zip:
    post:
      summary: Ingest a ZIP upload and create a snapshot
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZipIngestReq'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZipIngestRes'
  /v1/projects/{projectId}/ingest/zip/upload:
    post:
      summary: Upload a ZIP directly and create a snapshot
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZipIngestRes'
  /v1/projects/{projectId}/ingest/zip/initiate:
    post:
      summary: Initiate a signed upload for a ZIP and return an upload URL
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZipIngestInitiateReq'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZipIngestInitiateRes'
  /v1/projects/{projectId}/ingest/zip/complete:
    post:
      summary: Complete an initiated ZIP upload and create a snapshot
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZipIngestCompleteReq'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZipIngestRes'
  /v1/projects/{projectId}/ingest/zip/uploads/{uploadId}:
    put:
      summary: Upload a ZIP to the signed URL and create a snapshot
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZipUploadRes'
components:
  schemas:
    ZipIngestInitiateReq:
      type: object
      additionalProperties: false
      properties:
        filename: { type: string, minLength: 1 }
    ZipIngestReq:
      type: object
      required: [filename, sizeBytes, sha256]
      properties:
        filename: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the uploaded archive
          pattern: '^[a-f0-9]{64}$'
    ZipIngestRes:
      type: object
      required: [snapshotId]
      properties:
        snapshotId:
          type: string
          pattern: '^snap_[0-9a-f]{32}$'
    ZipIngestInitiateRes:
      type: object
      required: [uploadId, uploadUrl, expiresAt, filename, maxBytes]
      properties:
        uploadId: { type: string }
        uploadUrl: { type: string }
        uploadBackend:
          type: string
          enum: [service, s3]
        expiresAt: { type: string }
        method:
          type: string
          enum: [PUT]
        contentType:
          type: string
          enum: [application/zip]
        filename: { type: string }
        maxBytes: { type: integer, minimum: 1 }
        bucket: { type: string, minLength: 1 }
        objectKey: { type: string, minLength: 1 }
    ZipIngestCompleteReq:
      type: object
      additionalProperties: false
      required: [uploadId, filename]
      properties:
        uploadId: { type: string, minLength: 1 }
        filename: { type: string, minLength: 1 }
        sha256:
          type: string
          description: Optional lowercase hex SHA-256 claim for the uploaded archive
          pattern: '^[a-f0-9]{64}$'
    ZipUploadRes:
      type: object
      required: [snapshotId, sha256, sizeBytes]
      properties:
        snapshotId:
          type: string
          pattern: '^snap_[0-9a-f]{32}$'
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the uploaded archive
          pattern: '^[a-f0-9]{64}$'
        sizeBytes: { type: integer, minimum: 1 }
