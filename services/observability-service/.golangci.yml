version: 1
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosimple
    - misspell
    - unconvert
    - typecheck
    - exportloopref
    - nilerr

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
