name: ci-fix-engine-service
on:
  push: { branches: [ main ], paths: [ 'services/fix-engine-service/**' ] }
jobs:
  call:
    uses: ./.github/workflows/_service-ci.yml
    with:
      lang: node
      context: services/fix-engine-service
      dockerfile: services/fix-engine-service/Dockerfile
      image_suffix: fix-engine-service
