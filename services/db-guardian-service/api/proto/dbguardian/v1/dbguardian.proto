syntax = "proto3";
package dbguardian.v1;
option go_package = "example.com/lma/db-guardian-service/api/proto/dbguardian/v1;dbguardianv1";

message RegisterConnectionRequest {
  string project_id = 1;
  string name = 2;
  string driver = 3;
  string dsn_ref = 4;
  bool make_default = 5;
}
message RegisterConnectionResponse { string id = 1; }

message ListConnectionsRequest { string project_id = 1; }
message Connection {
  string id = 1; string project_id = 2; string name = 3; string driver = 4; string dsn_ref = 5; bool is_default = 6;
}
message ListConnectionsResponse { repeated Connection connections = 1; }

message ValidateMigrationRequest {
  string project_id = 1; string migration_name = 2; string sql = 3;
  bool check_breaking = 4; bool check_performance = 5; int64 max_table_size_bytes = 6;
}
message ValidateMigrationResponse { string status = 1; string findings_json = 2; }

message RunAnalysisRequest { string project_id = 1; string migration_name = 2; string sql = 3; }
message RunAnalysisResponse { string report_json = 1; }

message GetRecommendationsRequest { string project_id = 1; bool only_unapplied = 2; }
message IndexRecommendation { string table_name = 1; repeated string columns = 2; int32 benefit_score = 3; string reason = 4; }
message RoleRecommendation { int32 roles_analyzed = 1; }
message GetRecommendationsResponse { repeated IndexRecommendation index = 1; RoleRecommendation role = 2; }

message GetPolicyRequest { string project_id = 1; }
message GetPolicyResponse { string project_id = 1; string spec_yaml = 2; int32 version = 3; }
message UpdatePolicyRequest { string project_id = 1; string spec_yaml = 2; }
message UpdatePolicyResponse { string project_id = 1; string spec_yaml = 2; int32 version = 3; }

message CheckDriftRequest { string project_id = 1; }
message CheckDriftResponse { repeated string missing_indexes = 1; repeated string extra_indexes = 2; repeated string role_drift = 3; }

service DbGuardianService {
  rpc RegisterConnection(RegisterConnectionRequest) returns (RegisterConnectionResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc ValidateMigration(ValidateMigrationRequest) returns (ValidateMigrationResponse);
  rpc RunAnalysis(RunAnalysisRequest) returns (RunAnalysisResponse);
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc CheckDrift(CheckDriftRequest) returns (CheckDriftResponse);
}
