image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-webhook-relay-service
  tag: replace-with-ci-tag
service:
  port: 7903
env:
  ENV: prod
  SERVICE_PORT: '7903'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  DLQ_STREAM: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: webhook-relay-service-secrets
  remotePath: secret/data/lma/webhook-relay-service/prod
  keys:
  - WEBHOOK_SIGNING_SECRET
