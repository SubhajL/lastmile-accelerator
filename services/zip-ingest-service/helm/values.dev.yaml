image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-zip-ingest-service
  tag: dev
service:
  port: 7052
env:
  ENV: dev
  SERVICE_PORT: '7052'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-dev.svc.cluster.local:4317
  MAX_UPLOAD_MB: ''
  CLAMAV_URL: ''
  ZIP_UPLOAD_BACKEND: s3
  ZIP_UPLOAD_PREFIX: zip-uploads/
  SNAPSHOT_S3_REGION: us-east-1
  SNAPSHOT_S3_FORCE_PATH_STYLE: 'true'
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
hpa:
  enabled: false
externalSecrets:
  enabled: true
  storeRefName: vault-dev
  targetName: zip-ingest-service-secrets
  remotePath: secret/data/lma/zip-ingest-service/dev
  keys:
  - SNAPSHOT_BUCKET
  - SNAPSHOT_S3_ENDPOINT
  - SNAPSHOT_S3_ACCESS_KEY
  - SNAPSHOT_S3_SECRET_KEY
