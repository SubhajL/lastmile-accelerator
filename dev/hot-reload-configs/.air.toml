# Air configuration for Go services hot-reload
# https://github.com/cosmtrek/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Binary output path
  bin = "./tmp/main"
  
  # Command to build
  cmd = "go build -o ./tmp/main ./cmd/*"
  
  # Delay before rebuilding (ms)
  delay = 1000
  
  # Stop running process before building
  exclude_dir = ["tmp", "vendor", "testdata", "helm"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  
  # Watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  
  # Add build arguments
  args_bin = []
  
  # Build for current OS/Arch
  full_bin = ""
  
  # Log colored output
  log = "build-errors.log"
  
  # Send interrupt signal before killing process
  send_interrupt = true
  
  # Delay after sending interrupt (ms)
  kill_delay = 500

[color]
  # Colored output
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
  app = ""

[log]
  # Show log time
  time = false

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
