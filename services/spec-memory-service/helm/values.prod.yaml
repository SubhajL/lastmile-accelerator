image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-spec-memory-service
  tag: replace-with-ci-tag
service:
  port: 7101
env:
  ENV: prod
  SERVICE_PORT: '7101'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  EMBEDDING_PROVIDER: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: spec-memory-service-secrets
  remotePath: secret/data/lma/spec-memory-service/prod
  keys:
  - DATABASE_URL
  - EMBEDDING_API_KEY
