syntax = "proto3";

package lma.secretsenv.v1;

option go_package = "example.com/lma/secrets-env-service/internal/grpc/gen/secretsenvv1;secretsenvv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message SecretMeta {
  string id = 1;
  string key = 2;
  string environment = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetSecretRequest {
  string tenant_id = 1;
  string project_id = 2;
  string key = 3;
  string environment = 4;
}

message GetSecretResponse {
  SecretMeta meta = 1;
  google.protobuf.Struct value = 2;
}

message ListSecretsRequest {
  string project_id = 1;
  string environment = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListSecretsResponse {
  repeated SecretMeta items = 1;
  string next_page_token = 2;
}

message CheckEnvParityRequest {
  string project_id = 1;
  string base_env = 2;
  string compare_env = 3;
}

message CheckEnvParityResponse {
  string project_id = 1;
  google.protobuf.Timestamp scan_timestamp = 2;
  repeated string missing_keys = 3;
  repeated string extra_keys = 4;
  bool has_drift = 5;
}

service SecretsEnvService {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc CheckEnvParity(CheckEnvParityRequest) returns (CheckEnvParityResponse);
}
