image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-mvp-validator-service
  tag: replace-with-ci-tag
service:
  port: 7402
env:
  ENV: staging
  SERVICE_PORT: '7402'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-staging.svc.cluster.local:4317
  DEFAULT_ACTIVATION_TARGET: ''
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
externalSecrets:
  enabled: true
  storeRefName: vault-staging
  targetName: mvp-validator-service-secrets
  remotePath: secret/data/lma/mvp-validator-service/staging
  keys:
  - FEATURE_FLAG_SDK_KEY
