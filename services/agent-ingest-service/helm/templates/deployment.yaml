apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ingest-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent-ingest-service }
  template:
    metadata:
      labels: { app: agent-ingest-service }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: agent-ingest-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
          {{- range $name, $val := .Values.env }}
            - name: {{ $name }}
              value: {{ $val | quote }}
          {{- end }}
          {{- if .Values.externalSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecrets.targetName }}
          {{- end }}
          ports:
            - containerPort: 7053
          readinessProbe:
            httpGet: { path: /healthz, port: 7053 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 7053 }
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
              memory: "{{ .Values.resources.limits.memory }}"
