name: CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: go vet (db-guardian-service)
        working-directory: services/db-guardian-service
        run: go vet ./...
      - name: golangci-lint (db-guardian-service)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/db-guardian-service
      - name: Unit tests (db-guardian-service)
        working-directory: services/db-guardian-service
        run: go test ./... -cover
