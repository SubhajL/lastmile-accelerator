image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-agent-ingest-service
  tag: replace-with-ci-tag
service:
  port: 7053
env:
  ENV: prod
  SERVICE_PORT: '7053'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  AGENT_PUBLIC_KEY_JWKS: ''
  REPORT_MAX_MB: ''
  RESULTS_BUCKET: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: agent-ingest-service-secrets
  remotePath: secret/data/lma/agent-ingest-service/prod
  keys: []
