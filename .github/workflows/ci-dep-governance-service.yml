name: ci-dep-governance-service
on:
  push: { branches: [ main ], paths: [ 'services/dep-governance-service/**', 'packages/contracts/**' ] }
  pull_request: { paths: [ 'services/dep-governance-service/**', 'packages/contracts/**' ] }
jobs:
  call:
    uses: ./.github/workflows/_service-ci.yml
    with:
      lang: rust
      context: services/dep-governance-service
      dockerfile: services/dep-governance-service/Dockerfile
      image_suffix: dep-governance-service
