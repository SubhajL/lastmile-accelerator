image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-legal-automator-service
  tag: replace-with-ci-tag
service:
  port: 7503
env:
  ENV: prod
  SERVICE_PORT: '7503'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-prod.svc.cluster.local:4317
  JURISDICTIONS_JSON: ''
  DSAR_INBOX_EMAIL: ''
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
externalSecrets:
  enabled: true
  storeRefName: vault-prod
  targetName: legal-automator-service-secrets
  remotePath: secret/data/lma/legal-automator-service/prod
  keys: []
