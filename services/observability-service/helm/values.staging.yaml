image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-observability-service
  tag: replace-with-ci-tag
service:
  port: 7301
env:
  ENV: staging
  SERVICE_PORT: '7301'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-staging.svc.cluster.local:4317
  ALERT_EMAIL_FROM: ''
  SLO_BUDGETS_JSON: ''
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
externalSecrets:
  enabled: true
  storeRefName: vault-staging
  targetName: observability-service-secrets
  remotePath: secret/data/lma/observability-service/staging
  keys:
  - PAGERDUTY_ROUTING_KEY
