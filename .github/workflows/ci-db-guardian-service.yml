name: ci-db-guardian-service
on:
  pull_request:
    paths:
      - 'services/db-guardian-service/**'
  push:
    branches: [ main ]
    paths:
      - 'services/db-guardian-service/**'
jobs:
  push-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: go vet (push)
        working-directory: services/db-guardian-service
        run: go vet ./...
      - name: golangci-lint (push)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/db-guardian-service
          args: -c .golangci.yml
  pr-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Unit tests (go)
        working-directory: services/db-guardian-service
        run: go test ./... -cover

  push-build:
    if: github.event_name == 'push'
    needs: [push-lint]
    uses: ./.github/workflows/_service-ci.yml
    with:
      lang: go
      context: services/db-guardian-service
      dockerfile: services/db-guardian-service/Dockerfile
      image_suffix: db-guardian-service
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write
