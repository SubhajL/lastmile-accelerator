  pr-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with: { version: '27.1' }
      - name: go vet (pr)
        working-directory: services/db-guardian-service
        run: go vet ./...
      - name: golangci-lint (pr)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/db-guardian-service
          args: -c .golangci.yml
      - name: Unit tests (go)
        working-directory: services/db-guardian-service
        run: go test ./... -cover
      - name: Verify gRPC codegen (pr)
        working-directory: services/db-guardian-service
        run: |
          make grpc-codegen
          git --no-pager diff --exit-code -- dbguardian/v1 || (echo "Run 'make grpc-codegen' and commit generated code" && exit 1)

  push-build:
    if: github.event_name == 'push'
    needs: [push-lint]
    uses: ./.github/workflows/_service-ci.yml
    with:
      lang: go
      context: services/db-guardian-service
      dockerfile: services/db-guardian-service/Dockerfile
      image_suffix: db-guardian-service
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write
