name: ci-webhook-relay-service
on:
  push: { branches: [ main ], paths: [ 'services/webhook-relay-service/**' ] }
jobs:
  call:
    uses: ./.github/workflows/_service-ci.yml
    with:
      lang: go
      context: services/webhook-relay-service
      dockerfile: services/webhook-relay-service/Dockerfile
      image_suffix: webhook-relay-service
