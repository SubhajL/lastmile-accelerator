services:
  postgres:
    image: postgres:16-alpine
    container_name: lma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - ./vol/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lma-redis
    restart: unless-stopped
    ports:
      - "4050:6379"

  minio:
    image: minio/minio:latest
    container_name: lma-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    volumes:
      - ./vol/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-setup:
    image: minio/mc:latest
    container_name: lma-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./scripts/create-buckets.sh:/scripts/create-buckets.sh:ro

  nats:
    image: nats:2
    container_name: lma-nats
    command: ["-js", "-sd", "/data"]
    restart: unless-stopped
    ports:
      - "4222:4222" # client
      - "8222:8222" # http monitor
    volumes:
      - ./vol/nats:/data

  nats-setup:
    image: natsio/nats-box:latest
    container_name: lma-nats-setup
    depends_on:
      - nats
    entrypoint: ["/bin/sh", "/scripts/nats-setup.sh"]
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./scripts/nats-setup.sh:/scripts/nats-setup.sh:ro

  vault:
    image: hashicorp/vault:1.16
    container_name: lma-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: lma-root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: ["server", "-dev", "-dev-root-token-id=lma-root", "-dev-listen-address=0.0.0.0:8200"]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-setup:
    image: hashicorp/vault:1.16
    container_name: lma-vault-setup
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: lma-root
    entrypoint: ["/bin/sh", "/scripts/vault-setup.sh"]
    volumes:
      - ./scripts/vault-setup.sh:/scripts/vault-setup.sh:ro

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: lma-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    ports:
      - "8050:8080"
    volumes:
      - ./keycloak/realm-lma.json:/opt/keycloak/data/import/realm-lma.json:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: lma-otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Collector metrics

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: lma-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./vol/prometheus:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lma-alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:2.9.6
    container_name: lma-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ./vol/loki:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.4.1
    container_name: lma-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./vol/tempo:/var/tempo
    ports:
      - "3200:3200"   # Tempo query
      - "4320:4317"   # optional external OTLP if desired

  grafana:
    image: grafana/grafana:10.4.3
    container_name: lma-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"

  clamav:
    image: mkodockx/docker-clamav:alpine
    container_name: lma-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"

  gitea:
    image: gitea/gitea:1.22
    container_name: lma-gitea
    restart: unless-stopped
    ports:
      - "4001:3000" # HTTP UI
      - "2222:22"   # SSH
    volumes:
      - ./vol/gitea:/data
    environment:
      GITEA__server__ROOT_URL: "http://localhost:4001/"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: "devsecret"
      GITEA__service__DISABLE_REGISTRATION: "false"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: lma-mailhog
    restart: unless-stopped
    ports:
      - "8030:8025"  # Web UI
      - "1030:1025"  # SMTP
