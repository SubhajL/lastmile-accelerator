image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-spec-memory-service
  tag: dev
service:
  port: 7101
env:
  ENV: dev
  SERVICE_PORT: '7101'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-dev.svc.cluster.local:4317
  EMBEDDING_PROVIDER: ''
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
hpa:
  enabled: false
externalSecrets:
  enabled: true
  storeRefName: vault-dev
  targetName: spec-memory-service-secrets
  remotePath: secret/data/lma/spec-memory-service/dev
  keys:
  - DATABASE_URL
  - EMBEDDING_API_KEY
