image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-dep-governance-service
  tag: replace-with-ci-tag
service:
  port: 7106
env:
  ENV: staging
  SERVICE_PORT: '7106'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-staging.svc.cluster.local:4317
  SYFT_OPTS: ''
  GRYPE_DB_DIR: ''
  LICENSE_ALLOWLIST: ''
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
externalSecrets:
  enabled: true
  storeRefName: vault-staging
  targetName: dep-governance-service-secrets
  remotePath: secret/data/lma/dep-governance-service/staging
  keys: []
