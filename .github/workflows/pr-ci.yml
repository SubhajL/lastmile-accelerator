name: CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.1'
      - name: Install protoc plugins
        run: |
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: go vet (db-guardian-service)
        working-directory: services/db-guardian-service
        run: go vet ./...
      - name: golangci-lint (db-guardian-service)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/db-guardian-service
          args: -c .golangci.yml
      - name: Unit tests (db-guardian-service)
        working-directory: services/db-guardian-service
        run: go test ./... -cover
      - name: Verify gRPC codegen is up-to-date
        working-directory: services/db-guardian-service
        run: |
          make grpc-codegen
          git --no-pager diff --exit-code -- dbguardian/v1 || (echo "Run 'make grpc-codegen' and commit generated code" && exit 1)
