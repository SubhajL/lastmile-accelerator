name: CI

on:
  pull_request:
  push:
    branches: [ main, db-guardian-service ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality Check (typecheck + lint + any-budget + test:typecheck)
        run: bun run quality:check
