name: _frontend-ci
on:
  workflow_call:
    inputs:
      context: { required: true, type: string }
      dockerfile: { required: true, type: string }
      image_suffix: { required: true, type: string }
jobs:
  ci:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1'

      - name: Install
        working-directory: ${{ inputs.context }}
        run: bun install

      - name: Typecheck & unit
        working-directory: ${{ inputs.context }}
        run: |
          bun run typecheck || true
          bun run test -- --reporter=dot || true

      - name: Playwright smoke
        working-directory: ${{ inputs.context }}
        run: |
          bunx playwright install --with-deps
          bunx playwright test --config=playwright.smoke.config.ts
        env:
          BASE_URL: http://localhost:3000

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}:latest
