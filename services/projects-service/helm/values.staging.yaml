image:
  repository: ghcr.io/{{ORG}}/{{REPO}}-projects-service
  tag: replace-with-ci-tag
service:
  port: 7002
env:
  ENV: staging
  SERVICE_PORT: '7002'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.lma-staging.svc.cluster.local:4317
  JWT_PUBLIC_KEY: ''
  S3_BUCKET_PROJECTS: ''
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
externalSecrets:
  enabled: true
  storeRefName: vault-staging
  targetName: projects-service-secrets
  remotePath: secret/data/lma/projects-service/staging
  keys:
  - DATABASE_URL
